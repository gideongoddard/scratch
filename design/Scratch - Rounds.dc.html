<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html{font-size:16px;-webkit-font-smoothing:antialiased;}
  body{min-height:100dvh;}
  .tnum{font-variant-numeric:tabular-nums lining-nums;}
</style>
</helmet>

<div style="--bg:oklch(0.983 0.007 74);--surface:oklch(0.997 0.004 80);--surface-2:oklch(0.963 0.009 74);--border:oklch(0.902 0.011 68);--border-strong:oklch(0.83 0.015 64);--fg:oklch(0.255 0.016 52);--fg-muted:oklch(0.505 0.018 52);--fg-subtle:oklch(0.645 0.015 58);--accent:oklch(0.575 0.138 46);--accent-muted:oklch(0.952 0.034 54);--good:oklch(0.6 0.092 192);--bad:oklch(0.57 0.162 22);--e1:0 1px 2px oklch(0.3 0.03 58 / 0.08), 0 0 0 1px oklch(0.902 0.011 68);--e2:0 5px 16px oklch(0.3 0.03 58 / 0.1), 0 0 0 1px oklch(0.902 0.011 68);--mono:'JetBrains Mono',ui-monospace,monospace;--sans:'Hanken Grotesk',ui-sans-serif,system-ui,sans-serif;--disp:'Archivo',ui-sans-serif,system-ui,sans-serif;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;min-height:100vh;display:flex;">

  <!-- sidebar -->
  <div style="width:210px;flex:0 0 210px;background:var(--surface);border-right:1px solid var(--border);padding:18px 14px;display:flex;flex-direction:column;gap:3px;min-height:100vh;">
    <div style="display:flex;align-items:center;gap:9px;padding:6px 10px 18px;"><div style="width:24px;height:24px;border-radius:7px;background:var(--accent);display:flex;align-items:center;justify-content:center;"><svg width="12" height="12" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2" fill="white"></circle><circle cx="8" cy="8" r="5.6" stroke="white" stroke-opacity="0.5" stroke-width="1.2" fill="none"></circle></svg></div><span style="font-family:var(--disp);font-weight:700;font-size:16px;">Scratch</span></div>

    <div style="display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:var(--fg-muted);font-size:13.5px;"><svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="6" height="6" rx="1.5"></rect><rect x="9" y="1" width="6" height="6" rx="1.5"></rect><rect x="1" y="9" width="6" height="6" rx="1.5"></rect><rect x="9" y="9" width="6" height="6" rx="1.5"></rect></svg>Dashboard</div>
    <div style="display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;background:var(--accent-muted);color:var(--accent);font-weight:600;font-size:13.5px;"><svg width="15" height="15" viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.4" fill="none"><line x1="2" y1="4" x2="14" y2="4"></line><line x1="2" y1="8" x2="14" y2="8"></line><line x1="2" y1="12" x2="14" y2="12"></line></svg>Rounds</div>
    <div style="display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:var(--fg-muted);font-size:13.5px;"><svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><rect x="2" y="6" width="4" height="8" rx="1"></rect><rect x="10" y="2" width="4" height="12" rx="1"></rect></svg>Compare</div>
    <div style="display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:var(--fg-muted);font-size:13.5px;"><svg width="15" height="15" viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.4" fill="none"><circle cx="8" cy="8" r="6"></circle><circle cx="8" cy="8" r="1.6" fill="currentColor" stroke="none"></circle></svg>Hole analysis</div>
    <div style="display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:var(--fg-muted);font-size:13.5px;"><svg width="15" height="15" viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.4" fill="none"><line x1="4" y1="1.5" x2="4" y2="14.5"></line><path d="M4 2.5 L12 4.5 L4 6.5" fill="currentColor" stroke="none"></path></svg>Courses</div>

    <div style="flex:1;"></div>

    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 11px;margin-bottom:8px;border-radius:9px;background:var(--surface-2);"><span style="font-size:12px;color:var(--fg-subtle);">Handicap</span><span class="tnum" style="font-family:var(--disp);font-weight:700;font-size:15px;">30</span></div>
    <div style="display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;border-radius:9px;background:var(--accent);color:white;font-weight:600;font-size:13.5px;box-shadow:0 2px 10px oklch(0.575 0.138 46 / 0.3);cursor:pointer;"><svg width="14" height="14" viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.8"><line x1="8" y1="3" x2="8" y2="13"></line><line x1="3" y1="8" x2="13" y2="8"></line></svg>Log a round</div>
    <div style="display:flex;align-items:center;gap:9px;padding:9px 11px;margin-top:2px;border-radius:9px;color:var(--fg-subtle);font-size:12.5px;cursor:pointer;" style-hover="background:var(--surface-2);color:var(--fg-muted);"><svg width="13" height="13" viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.5" fill="none"><path d="M6 2 H3.5 A1 1 0 0 0 2.5 3 V13 A1 1 0 0 0 3.5 14 H6"></path><line x1="6.5" y1="8" x2="14" y2="8"></line><path d="M11 5 L14 8 L11 11"></path></svg>Sign out</div>
  </div>

  <!-- main -->
  <div style="flex:1;min-width:0;padding:34px 40px 60px;">
    <h1 style="font-family:var(--disp);font-weight:700;font-size:28px;letter-spacing:-0.02em;margin-bottom:24px;">Rounds <span style="font-weight:500;font-size:15px;color:var(--fg-subtle);">· {{ count }} logged</span></h1>

    <div style="display:flex;flex-direction:column;gap:10px;max-width:1080px;">
      <sc-for list="{{ rounds }}" as="r" hint-placeholder-count="4">
        <div style="background:var(--surface);border-radius:14px;box-shadow:var(--e1);padding:18px 20px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:box-shadow .15s;" style-hover="box-shadow:var(--e2);">
          <div style="flex:1 1 260px;min-width:260px;">
            <div style="display:flex;align-items:center;gap:9px;margin-bottom:3px;">
              <span style="font-family:var(--disp);font-weight:700;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ r.course }}</span>
              <span style="font-size:11.5px;font-weight:500;color:var(--fg-muted);background:var(--surface-2);padding:3px 9px;border-radius:999px;white-space:nowrap;flex:0 0 auto;">{{ r.tees }}</span>
            </div>
            <div style="font-size:12.5px;color:var(--fg-subtle);white-space:nowrap;">{{ r.date }} · {{ r.holes }}</div>
          </div>

          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:0 0 auto;padding:2px 14px;border-left:1px solid var(--border);border-right:1px solid var(--border);">
            <span style="font-size:11px;color:var(--fg-subtle);font-weight:600;">Gross</span>
            <span class="tnum" style="font-family:var(--disp);font-weight:700;font-size:32px;line-height:1;color:var(--fg);">{{ r.gross }}</span>
            <span class="tnum" style="font-family:var(--disp);font-weight:600;font-size:13px;color:{{ r.vsParCol }};">{{ r.vsPar }}</span>
          </div>

          <div style="display:grid;grid-template-columns:repeat(4,38px);gap:0 10px;flex:0 0 auto;">
            <sc-for list="{{ r.stats }}" as="s" hint-placeholder-count="4">
              <div style="text-align:center;">
                <div style="font-size:10.5px;color:var(--fg-subtle);font-weight:600;margin-bottom:3px;">{{ s.label }}</div>
                <div class="tnum" style="font-family:var(--disp);font-weight:600;font-size:15px;color:var(--fg-muted);">{{ s.value }}</div>
              </div>
            </sc-for>
          </div>

          <div style="flex:0 0 auto;width:30px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--fg-subtle);" style-hover="background:var(--surface-2);color:var(--fg);">
            <svg width="15" height="15" viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.6" fill="none"><path d="M6 3 L11 8 L6 13"></path></svg>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const mkStats = (net, gir, putts, hcp) => ([
      { label: "Net", value: net },
      { label: "GIR", value: gir },
      { label: "Putts", value: putts },
      { label: "HCP", value: hcp },
    ]);
    const rounds = [
      { course: "Humberstone Heights", tees: "Yellow tees", date: "18 Jul 2026", holes: "18 holes", gross: "105", vsPar: "+35", vsParCol: "var(--bad)", stats: mkStats("74", "1/18", "37", "30") },
      { course: "Waterstock Golf Club", tees: "Yellow tees", date: "27 Jun 2026", holes: "18 holes", gross: "106", vsPar: "+34", vsParCol: "var(--bad)", stats: mkStats("\u2014", "1/18", "35", "\u2014") },
      { course: "Humberstone Heights", tees: "Yellow tees", date: "21 Jun 2026", holes: "18 holes", gross: "106", vsPar: "+36", vsParCol: "var(--bad)", stats: mkStats("\u2014", "2/18", "43", "\u2014") },
      { course: "Humberstone Heights", tees: "Yellow tees", date: "14 Jun 2026", holes: "18 holes", gross: "107", vsPar: "+37", vsParCol: "var(--bad)", stats: mkStats("\u2014", "1/18", "42", "\u2014") },
    ];
    return { rounds, count: rounds.length };
  }
}
</script>
</body>
</html>
